name: openjdk
plans:
  - plan: nogc
    baseline: ['jdk-epsilon']
  - plan: semispace
    baseline: ['jdk-g1', 'jdk-zgc']
  - plan: gencopy
    baseline: ['jdk-g1', 'jdk-zgc']
  - plan: immix
    baseline: ['jdk-g1', 'jdk-zgc']
  - plan: genimmix
    baseline: ['jdk-g1', 'jdk-zgc']
  - plan: stickyimmix
    baseline: ['jdk-g1', 'jdk-zgc']
  - plan: marksweep
    baseline: ['jdk-g1', 'jdk-zgc']
  - plan: lisp2
    baseline: ['jdk-g1', 'jdk-zgc']
  - plan: ovc
    baseline: ['jdk-g1', 'jdk-zgc']
  # history_report.py plots every directory under result_repo_vm_root (see
  # os.listdir(result_repo_vm_root) in history_report.py), not just the plans
  # listed here - it just needs a config entry to find each one's baseline.
  # markcompact/compressor are the pre-rename directory names that already
  # exist in the result repo with real history in them; they need to stay
  # listed (even though new runs land under lisp2/ovc above) or
  # get_config_for_plan() returns None and history_report.py's assertion
  # ("Cannot get config for plan") crashes the whole report generation step.
  # hidden: true keeps markcompact/compressor out of the generated index.html
  # (see index_gen.py) - they're only listed here for the baseline lookup
  # above, not meant to show up as their own cards any more.
  - plan: markcompact
    baseline: ['jdk-g1', 'jdk-zgc']
    hidden: true
  - plan: compressor
    baseline: ['jdk-g1', 'jdk-zgc']
    hidden: true
  - plan: concurrentimmix
    baseline: ['jdk-g1', 'jdk-zgc']
  # "canary" is not a real plan.  It is for the canary build.
  # We add it here to make history_report.py recognize its result
  # and plot it in a separate block in parallel to other real plans in OpenJDK.
  - plan: canary
    baseline: ['jdk-g1', 'jdk-zgc']
