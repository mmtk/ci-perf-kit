includes:
  - "./running-base.yml"

benchmarks:
  dacapochopin:
    - avrora
    - batik
    # biojava genuinely takes ~13-16min/iteration under the Compressor plan
    # (verified stable across multiple historical runs, not a fluke) - needs
    # its own longer timeout instead of the suite-wide one below. See "suites.
    # dacapochopin.timeout" in overrides for why the default was lowered.
    - bm_name: biojava
      name: biojava
      timeout: 1800
    - cassandra
    - eclipse
    - fop
    - graphchi
    # h2 genuinely takes up to ~7min/iteration under MarkCompact (full-heap
    # compaction overhead) - same reasoning as biojava above.
    - bm_name: h2
      name: h2
      timeout: 900
    - h2o
    - jme
    - jython
    - kafka
    - luindex
    - lusearch
    - pmd
    - spring
    - sunflow
    - tomcat
    - tradebeans
    - tradesoap
    - xalan
    - zxing

modifiers:
  # OpenJDK options
  tph:
    type: JVMArg
    val: "-XX:+UseThirdPartyHeap"
  c2:
    type: JVMArg
    val: "-XX:-TieredCompilation -Xcomp"
    excludes:
      # These two benchmarks exit with code 1
      dacapochopin:
        - tradebeans
        - tradesoap
  ms:
    type: JVMArg
    val: "-XX:MetaspaceSize=500M -XX:+DisableExplicitGC"
  s:
    type: JVMArg
    val: "-server"

  ## OpenJDK HotSpot
  hotspot_gc:
    type: JVMArg
    val: "-XX:-UseCompressedOops -XX:+UnlockExperimentalVMOptions -XX:+Use{0}GC"
  sgc:
    type: JVMArg
    val: "-XX:+UseSerialGC"
  g1:
    type: JVMArg
    val: "-XX:-UseCompressedOops -XX:+UseG1GC"
  epsilon:
    type: JVMArg
    val: "-XX:-UseCompressedOops -XX:+UnlockExperimentalVMOptions -XX:+UseEpsilonGC"
  cms:
    type: JVMArg
    val: "-XX:-UseCompressedOops -XX:+UseConcMarkSweepGC -XX:TLABSize=32K -XX:-ResizeTLAB"
  zgc:
    type: JVMArg
    val: "-XX:-UseCompressedOops -XX:+UnlockExperimentalVMOptions -XX:+UseZGC"
  pgc:
    type: JVMArg
    val: "-XX:-UseCompressedOops -XX:+UseParallelGC"

  common:
    type: ModifierSet
    # dacapochopin_jdk21 adds the --add-exports/--add-opens flags Chopin's
    # cassandra/h2o/tradebeans/tradesoap/etc. benchmarks need under JDK 21
    # (it chains through the jdk17/jdk11/jdk9 flags too, plus a JDK21-specific
    # h2o workaround).
    val: "ms|probes_cp|probes_openjdk|dacapochopin_jdk21"
  common_mmtk:
    type: ModifierSet
    # Intentionally does not build on "common": drops s/c2 (-server, forced
    # C2-only compilation) for MMTk plans, but keeps ms (metaspace size).
    # Still needs its own probes_cp + dacapochopin_jdk21 (see "common" above
    # for why).
    val: "tph|ms|probes_cp|probes_rustmmtk|dacapochopin_jdk21"

overrides:
  # running-ng ships dacapochopin pointing at the base 23.11 release jar;
  # pin it to the MR2 jar instead. (The "release" field is validated against
  # a fixed set of known DaCapo release strings, so it stays "23.11" - MR2 is
  # a bugfix release with the same benchmark set, not a new release line.)
  "suites.dacapochopin.path": "/usr/share/benchmarks/dacapo/dacapo-23.11-MR2-chopin.jar"
  # Without a callback, running-ng invokes `-jar dacapo.jar` directly, which
  # never drives ProbeMux (only a Callback subclass does) - so RustMMTkProbe's
  # begin/end (and therefore MMTk's own harness_begin/harness_end stats
  # printing) never fire, even though probes_rustmmtk sets -Dprobes=RustMMTk.
  # This applies to stock (non-MMTk) runs too, but is harmless there: with no
  # -Dprobes set, ProbeMux.init() just warns and no-ops.
  "suites.dacapochopin.callback": "probe.DacapoChopinCallback"
  # running-ng's shipped default (1800s) sized for the single slowest
  # benchmark (biojava under Compressor). Every other benchmark's legitimate
  # runtime is under ~300s (checked across all plans' latest runs), so a
  # process still running past 600s is hung, not just slow - e.g. h2o and
  # eclipse have both been observed thrashing/hanging for the full 1800s
  # under some plans (gencopy/genimmix/immix/stickyimmix for h2o; semispace/
  # stickyimmix for eclipse) instead of failing cleanly, wasting 30min each
  # for no usable data. Lowering the default to 600s kills those hangs 3x
  # faster; biojava and h2 (the two genuinely slow benchmarks) get their own
  # longer per-benchmark timeout override above in benchmarks.dacapochopin.
  "suites.dacapochopin.timeout": 600
  # Override running-ng's shipped default (5) down to 3 warmup+timed
  # iterations. running-openjdk-mutator.yml sets its own separate override
  # (2) on top of this, so it's unaffected by this change.
  "suites.dacapochopin.timing_iteration": 3
  # mmtk-openjdk's own CI (.github/configs/base.yml on jdk-21, run at 2.5x via
  # .github/workflows/run-dacapo-chopin.yml) sizes every plan's heap off
  # MarkCompact's min heap specifically. We try to use the same heap size
  # in the performance testing.
  # tradebeans/tradesoap: mmtk-openjdk lists those as infinite. We use
  # temurin-21-G1-n-5 finite values for just those two.
  "suites.dacapochopin.minheap_values.mmtk-openjdk-11-MarkCompact":
    avrora: 8
    batik: 426
    biojava: 197
    cassandra: 117
    eclipse: 439
    fop: 24
    graphchi: 195
    h2: 1122
    h2o: 136
    jme: 236
    jython: 48
    kafka: 243
    luindex: 25
    lusearch: 36
    pmd: 291
    spring: 110
    sunflow: 37
    tradebeans: 135 # mmtk-openjdk: .inf (MarkCompact can't bound this) - see above
    tradesoap: 91 # mmtk-openjdk: .inf (MarkCompact can't bound this) - see above
    tomcat: 55
    xalan: 19
    zxing: 427
  "suites.dacapochopin.minheap": "mmtk-openjdk-11-MarkCompact"

runtimes:
  jdk-mmtk:
    type: OpenJDK
    release: 21
    home: "./build/jdk-mmtk/images/jdk"
  jdk-stock:
    type: OpenJDK
    release: 21
    home: "./build/jdk-stock/images/jdk"
  jdk-mmtk-trunk:
    type: OpenJDK
    release: 21
    home: "./build/jdk-mmtk-trunk/images/jdk"
  jdk-mmtk-branch:
    type: OpenJDK
    release: 21
    home: "./build/jdk-mmtk-branch/images/jdk"
  jdk-mmtk-canary:
    type: OpenJDK
    release: 21
    home: "./build/jdk-mmtk-canary/images/jdk"
