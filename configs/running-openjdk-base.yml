includes:
  - "./running-base.yml"

benchmarks:
  dacapochopin:
    - avrora
    - batik
    - biojava
    - cassandra
    - eclipse
    - fop
    - graphchi
    - h2
    - h2o
    - jme
    - jython
    - kafka
    - luindex
    - lusearch
    - pmd
    - spring
    - sunflow
    - tomcat
    - tradebeans
    - tradesoap
    - xalan
    - zxing

modifiers:
  # OpenJDK options
  tph:
    type: JVMArg
    val: "-XX:+UseThirdPartyHeap"
  c2:
    type: JVMArg
    val: "-XX:-TieredCompilation -Xcomp"
    excludes:
      # These two benchmarks exit with code 1
      dacapochopin:
        - tradebeans
        - tradesoap
  ms:
    type: JVMArg
    val: "-XX:MetaspaceSize=500M -XX:+DisableExplicitGC"
  s:
    type: JVMArg
    val: "-server"

  ## OpenJDK HotSpot
  hotspot_gc:
    type: JVMArg
    val: "-XX:-UseCompressedOops -XX:+UnlockExperimentalVMOptions -XX:+Use{0}GC"
  sgc:
    type: JVMArg
    val: "-XX:+UseSerialGC"
  g1:
    type: JVMArg
    val: "-XX:-UseCompressedOops -XX:+UseG1GC"
  epsilon:
    type: JVMArg
    val: "-XX:-UseCompressedOops -XX:+UnlockExperimentalVMOptions -XX:+UseEpsilonGC"
  cms:
    type: JVMArg
    val: "-XX:-UseCompressedOops -XX:+UseConcMarkSweepGC -XX:TLABSize=32K -XX:-ResizeTLAB"
  zgc:
    type: JVMArg
    val: "-XX:-UseCompressedOops -XX:+UnlockExperimentalVMOptions -XX:+UseZGC"
  pgc:
    type: JVMArg
    val: "-XX:-UseCompressedOops -XX:+UseParallelGC"

  common:
    type: ModifierSet
    # dacapochopin_jdk11 adds the --add-exports/--add-opens flags Chopin's
    # cassandra/h2o/tradebeans/tradesoap/etc. benchmarks need under JDK 11.
    val: "ms|s|c2|probes_cp|dacapochopin_jdk11"
  common_mmtk:
    type: ModifierSet
    val: "common|tph|probes_rustmmtk"

overrides:
  # running-ng ships dacapochopin pointing at the base 23.11 release jar;
  # pin it to the MR2 jar instead. (The "release" field is validated against
  # a fixed set of known DaCapo release strings, so it stays "23.11" - MR2 is
  # a bugfix release with the same benchmark set, not a new release line.)
  "suites.dacapochopin.path": "/usr/share/benchmarks/dacapo/dacapo-23.11-MR2-chopin.jar"

runtimes:
  jdk-mmtk:
    type: OpenJDK
    release: 11
    home: "./build/jdk-mmtk/images/jdk"
  jdk-stock:
    type: OpenJDK
    release: 11
    home: "./build/jdk-stock/images/jdk"
  jdk-mmtk-trunk:
    type: OpenJDK
    release: 11
    home: "./build/jdk-mmtk-trunk/images/jdk"
  jdk-mmtk-branch:
    type: OpenJDK
    release: 11
    home: "./build/jdk-mmtk-branch/images/jdk"
  jdk-mmtk-canary:
    type: OpenJDK
    release: 11
    home: "./build/jdk-mmtk-canary/images/jdk"
