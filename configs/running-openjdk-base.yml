includes:
  - "./running-base.yml"

benchmarks:
  dacapochopin:
    - avrora
    - batik
    - biojava
    - cassandra
    - eclipse
    - fop
    - graphchi
    - h2
    - h2o
    - jme
    - jython
    - kafka
    - luindex
    - lusearch
    - pmd
    - spring
    - sunflow
    - tomcat
    - tradebeans
    - tradesoap
    - xalan
    - zxing

modifiers:
  # OpenJDK options
  tph:
    type: JVMArg
    val: "-XX:+UseThirdPartyHeap"
  c2:
    type: JVMArg
    val: "-XX:-TieredCompilation -Xcomp"
    excludes:
      # These two benchmarks exit with code 1
      dacapochopin:
        - tradebeans
        - tradesoap
  ms:
    type: JVMArg
    val: "-XX:MetaspaceSize=500M -XX:+DisableExplicitGC"
  s:
    type: JVMArg
    val: "-server"

  ## OpenJDK HotSpot
  hotspot_gc:
    type: JVMArg
    val: "-XX:-UseCompressedOops -XX:+UnlockExperimentalVMOptions -XX:+Use{0}GC"
  sgc:
    type: JVMArg
    val: "-XX:+UseSerialGC"
  g1:
    type: JVMArg
    val: "-XX:-UseCompressedOops -XX:+UseG1GC"
  epsilon:
    type: JVMArg
    val: "-XX:-UseCompressedOops -XX:+UnlockExperimentalVMOptions -XX:+UseEpsilonGC"
  cms:
    type: JVMArg
    val: "-XX:-UseCompressedOops -XX:+UseConcMarkSweepGC -XX:TLABSize=32K -XX:-ResizeTLAB"
  zgc:
    type: JVMArg
    val: "-XX:-UseCompressedOops -XX:+UnlockExperimentalVMOptions -XX:+UseZGC"
  pgc:
    type: JVMArg
    val: "-XX:-UseCompressedOops -XX:+UseParallelGC"

  common:
    type: ModifierSet
    # dacapochopin_jdk21 adds the --add-exports/--add-opens flags Chopin's
    # cassandra/h2o/tradebeans/tradesoap/etc. benchmarks need under JDK 21
    # (it chains through the jdk17/jdk11/jdk9 flags too, plus a JDK21-specific
    # h2o workaround).
    val: "ms|probes_cp|probes_openjdk|dacapochopin_jdk21"
  common_mmtk:
    type: ModifierSet
    # Intentionally does not build on "common": drops s/c2 (-server, forced
    # C2-only compilation) for MMTk plans, but keeps ms (metaspace size).
    # Still needs its own probes_cp + dacapochopin_jdk21 (see "common" above
    # for why).
    val: "tph|ms|probes_cp|probes_rustmmtk|dacapochopin_jdk21"

overrides:
  # running-ng ships dacapochopin pointing at the base 23.11 release jar;
  # pin it to the MR2 jar instead. (The "release" field is validated against
  # a fixed set of known DaCapo release strings, so it stays "23.11" - MR2 is
  # a bugfix release with the same benchmark set, not a new release line.)
  "suites.dacapochopin.path": "/usr/share/benchmarks/dacapo/dacapo-23.11-MR2-chopin.jar"
  # Without a callback, running-ng invokes `-jar dacapo.jar` directly, which
  # never drives ProbeMux (only a Callback subclass does) - so RustMMTkProbe's
  # begin/end (and therefore MMTk's own harness_begin/harness_end stats
  # printing) never fire, even though probes_rustmmtk sets -Dprobes=RustMMTk.
  # This applies to stock (non-MMTk) runs too, but is harmless there: with no
  # -Dprobes set, ProbeMux.init() just warns and no-ops.
  "suites.dacapochopin.callback": "probe.DacapoChopinCallback"

runtimes:
  jdk-mmtk:
    type: OpenJDK
    release: 21
    home: "./build/jdk-mmtk/images/jdk"
  jdk-stock:
    type: OpenJDK
    release: 21
    home: "./build/jdk-stock/images/jdk"
  jdk-mmtk-trunk:
    type: OpenJDK
    release: 21
    home: "./build/jdk-mmtk-trunk/images/jdk"
  jdk-mmtk-branch:
    type: OpenJDK
    release: 21
    home: "./build/jdk-mmtk-branch/images/jdk"
  jdk-mmtk-canary:
    type: OpenJDK
    release: 21
    home: "./build/jdk-mmtk-canary/images/jdk"
